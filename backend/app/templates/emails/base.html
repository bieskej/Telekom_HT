<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}HT Eronet{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f1f5f9;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,84,166,0.12);">
          <tr>
            <td style="background-color:#0054A6;padding:24px 28px;">
              <p style="margin:0;color:#ffffff;font-size:22px;font-weight:bold;">HT Eronet</p>
              <p style="margin:6px 0 0;color:#b3d4f5;font-size:13px;">{% block subtitle %}Telekomunikacijski sustav{% endblock %}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;color:#334155;font-size:15px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="background-color:#f8fafc;padding:16px 28px;border-top:1px solid #e2e8f0;text-align:center;">
              <p style="margin:0;color:#94a3b8;font-size:12px;">© 2026 HT Eronet d.d. Mostar</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
